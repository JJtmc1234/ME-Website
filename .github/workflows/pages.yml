# Publishes the public ME website to GitHub Pages.
#
# GitHub Pages hosts the site, and it is served from multiverse-enterprises.com,
# so the build has to come out of the root rather than a project path. Those two
# values are set here and nowhere else. See docs/deployment.md.
#
# There are no secrets here. The only credential used is the token GitHub
# issues to the workflow itself.
name: Deploy public site

on:
  push:
    branches:
      - main
      - tmp-lazy-note-extract-20260826
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('temporary-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  fetch-lazy-note-save:
    name: Extract lazy_kojocho 53h save
    if: github.ref == 'refs/heads/tmp-lazy-note-extract-20260826'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
      - name: Fetch hidden Note attachment
        run: python3 scripts/fetch_lazy_note.py
      - name: Upload extracted save and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazy-kojocho-53h-note-attachment
          path: result/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build:
    name: Build static export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository if it is not on already. Its
          # base_path output is deliberately not used: it reported the project
          # path after the custom domain was configured, which is what broke
          # every stylesheet on the domain.
          enablement: true

      - name: Install dependencies
        # ci, not install: the lockfile decides, so a build here matches a
        # build anywhere else.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # The site is served from a custom domain at the root, so there is no
        # path prefix. Empty on purpose, and stated rather than inferred.
        env:
          BASE_PATH: ""
          SITE_URL: https://multiverse-enterprises.com
        run: npm run build

      - name: Check the export produced pages
        run: |
          test -f out/index.html || { echo "no out/index.html" >&2; exit 1; }
          test -f out/.nojekyll || { echo "no out/.nojekyll" >&2; exit 1; }
          test -f out/CNAME || { echo "no out/CNAME" >&2; exit 1; }
          echo "exported $(find out -name 'index.html' | wc -l) pages"

      - name: Check nothing carries the old project path
        # The failure this guards against is quiet: the HTML arrives, the
        # stylesheet 404s, and the site reads as plain text. Better to fail here.
        run: |
          if grep -rl "/ME-Website/" out --include="*.html" --include="*.css" \
               --include="*.txt" --include="*.xml" | head -5 | grep .; then
            echo "the build contains the old project path" >&2
            exit 1
          fi
          grep -q "multiverse-enterprises.com" out/sitemap.xml \
            || { echo "sitemap does not use the public domain" >&2; exit 1; }
          echo "no project path in the output, sitemap on the public domain"

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
